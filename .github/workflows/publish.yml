name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Typecheck and test
        run: npm run test:unit

      - name: Build and verify dist
        run: npm run build && npm run verify:dist

      # Tokenless: publishes via npm Trusted Publishing (OIDC) — the trusted
      # publisher for this package is configured on npmjs.com (repository
      # GetMyOpinion/n8n-nodes-getmyopinion, workflow publish.yml). The
      # id-token: write permission above mints the short-lived publish token.
      - name: Publish with provenance
        run: npm publish --provenance --access public
